<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Security headers. GitHub Pages serves static files only and cannot send
     custom HTTP response headers, so everything enforceable here has to go
     through <meta> tags. X-Frame-Options and the frame-ancestors CSP
     directive are ignored when set this way (browsers only honor them as
     real HTTP headers) - see the README for how to close that gap with
     Cloudflare if you ever want it. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none';">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">

<title>{{ page.title }} · Ziad Saghir</title>
<link rel="stylesheet" href="{{ "/assets/style.css" | relative_url }}">
</head>
<body>
<header class="site-header">
  <h1><a href="{{ "/" | relative_url }}">Ziad Saghir</a> <span class="tagline">Blog</span></h1>
  <nav>
    <a href="{{ "/ctf.html" | relative_url }}">CTF Writeups</a>
    <a href="{{ "/cti.html" | relative_url }}">CTI</a>
    <a href="{{ "/math.html" | relative_url }}">Dump Math</a>
    <a href="{{ "/about.html" | relative_url }}">About</a>
  </nav>
</header>
<hr>
<main>
{{ content }}
</main>
<hr>
<footer>
  <p>&copy; {{ site.time | date: "%Y" }} Ziad Saghir</p>
</footer>
</body>
</html>
