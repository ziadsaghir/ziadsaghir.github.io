---
layout: default
title: CTI
---
<p>Threat hunting labs and threat intelligence writeups.</p>

<ul class="post-list">
{% for post in site.posts %}
  {% if post.section == "cti" %}
  <li class="post-item">
    <span class="post-date">{{ post.date | date: "%Y-%m-%d" }}</span>
    <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
  </li>
  {% endif %}
{% endfor %}
</ul>
